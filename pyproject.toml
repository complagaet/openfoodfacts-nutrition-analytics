[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offna"
version = "0.1.0"
description = "Open Food Facts nutrition analytics: large-scale ETL, engine benchmark, SQLite, Nutri-Score"
requires-python = ">=3.12,<3.13"

[project.scripts]
offna = "offna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLC0415", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
